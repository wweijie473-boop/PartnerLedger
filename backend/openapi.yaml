openapi: 3.1.0
info:
  title: PartnerLedger API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Check if the application process is alive
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /readyz:
    get:
      summary: Check both the application and table workspace MySQL schemas and Redis
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '503':
          $ref: '#/components/responses/Error'
  /api/auth/register:
    post:
      summary: Register the first account for a new organization
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, organization_name, organization_kind]
              additionalProperties: false
              properties:
                username: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{2,63}$' }
                password: { type: string, format: password, description: 12 to 72 UTF-8 bytes }
                organization_name: { type: string, minLength: 1, maxLength: 150 }
                organization_kind: { type: string, enum: [RESELLER, MANUFACTURER, CUSTOMER] }
      responses:
        '201':
          description: Account and isolated organization created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [organization_id]
                        properties:
                          organization_id: { $ref: '#/components/schemas/ID' }
        '409':
          description: Username unavailable
        '429':
          description: Registration rate limited
        default:
          $ref: '#/components/responses/Error'
  /api/auth/login:
    post:
      summary: Start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: dealer_demo }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session and user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [access_token, token_type, expires_in, user]
                        properties:
                          access_token: { type: string }
                          token_type: { const: Bearer }
                          expires_in: { type: integer, example: 43200 }
                          user: { $ref: '#/components/schemas/User' }
        default:
          $ref: '#/components/responses/Error'
  /api/auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /api/user/profile:
    get:
      summary: Read the authenticated user
      responses:
        '200':
          description: Current user and organization
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        default:
          $ref: '#/components/responses/Error'
  /api/org/current:
    get:
      summary: Read the current organization
      responses:
        '200':
          description: Current organization
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Organization' }
        default:
          $ref: '#/components/responses/Error'
  /api/search/v1/records:
    get:
      summary: Search for business records visible to the signed-in organization
      description: Returns up to three results per kind. Name terms are matched literally, and a standalone numeric query also matches exact record IDs.
      parameters:
        - name: q
          in: query
          required: true
          description: Up to eight whitespace-separated terms.
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: Matching record names and links to their workspaces
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            maxItems: 12
                            items:
                              type: object
                              required: [kind, label, description, href]
                              properties:
                                kind: { type: string, enum: [project, order, product, ticket] }
                                label: { type: string }
                                description: { type: string }
                                href: { type: string, description: Same-origin workspace route. }
        default:
          $ref: '#/components/responses/Error'
  /api/products:
    get:
      summary: List products visible to the current organization
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: after
          in: query
          schema: { type: string, pattern: '^[0-9]+$', default: '0' }
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Product' }
                          next_cursor: { type: [string, 'null'] }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Create a product as a manufacturer
      requestBody:
        $ref: '#/components/requestBodies/Product'
      responses:
        '201':
          $ref: '#/components/responses/Product'
        default:
          $ref: '#/components/responses/Error'
  /api/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      summary: Read a visible product
      responses:
        '200':
          $ref: '#/components/responses/Product'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Update a product that belongs to the manufacturer
      requestBody:
        $ref: '#/components/requestBodies/Product'
      responses:
        '200':
          $ref: '#/components/responses/Product'
        default:
          $ref: '#/components/responses/Error'
  /api/products/{id}/knowledge:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      summary: Get the matching profile for a visible product
      responses:
        '200':
          $ref: '#/components/responses/ProductKnowledge'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Replace the matching profile of a product owned by the manufacturer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductKnowledge' }
      responses:
        '200':
          $ref: '#/components/responses/ProductKnowledge'
        default:
          $ref: '#/components/responses/Error'
  /api/ai/parse-requirement:
    post:
      summary: Extract fields from a reseller's ERP requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
            example:
              text: 我们是 120 人的制造公司，需要 5.1 版本、财务库存和私有化部署。
      responses:
        '200':
          description: Structured extraction for human confirmation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Requirement'
        default:
          $ref: '#/components/responses/Error'
  /api/retail/v1/orders/requests/{requestId}:
    get:
      summary: Recover a committed retail order by its original submission ID
      description: The authenticated reseller or customer must be the original submitting account.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Committed order ID, even if the offer is no longer available
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [id]
                        properties:
                          id: { $ref: '#/components/schemas/ID' }
        default:
          $ref: '#/components/responses/Error'
  /api/retail/v1/operations/partners:
    get:
      summary: List counterparts with direct-purchase history and their service allowance balances
      parameters:
        - $ref: '#/components/parameters/OperationsCursor'
      responses:
        '200':
          description: Page of partners with limit_cents, pending_cents and paid_cents serialized as decimal strings
        default:
          $ref: '#/components/responses/Error'
  /api/retail/v1/operations/finance:
    get:
      summary: List deposits, invoice requests and service claims visible to the signed-in organization
      parameters:
        - $ref: '#/components/parameters/OperationsCursor'
      responses:
        '200':
          description: Page of finance records with amount_cents serialized as a decimal string
        default:
          $ref: '#/components/responses/Error'
  /api/retail/v1/operations/finance/{kind}:
    post:
      summary: Open a finance request as a reseller
      parameters:
        - $ref: '#/components/parameters/FinanceKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: For a deposit or service claim
                  required: [manufacturer_id, reference, amount_cents]
                  properties:
                    manufacturer_id: { $ref: '#/components/schemas/ID' }
                    reference: { type: string, minLength: 1, maxLength: 80 }
                    amount_cents: { type: integer, minimum: 1, maximum: 100000000 }
                - type: object
                  description: For an invoice on a paid order
                  required: [order_id, title]
                  properties:
                    order_id: { $ref: '#/components/schemas/ID' }
                    title: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /api/retail/v1/operations/finance/{kind}/{id}/complete:
    post:
      summary: Record the result of offline processing as the authorized manufacturer
      parameters:
        - $ref: '#/components/parameters/FinanceKind'
        - $ref: '#/components/parameters/OperationsID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result_reference]
              properties:
                result_reference: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /api/retail/v1/operations/allowances/{id}:
    put:
      summary: Set the service allowance for a reseller with direct-purchase history
      parameters:
        - $ref: '#/components/parameters/OperationsID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limit_cents]
              properties:
                limit_cents: { type: integer, minimum: 0, maximum: 100000000 }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /api/retail/v1/operations/tickets:
    get:
      summary: List service tickets and replies for the current organization
      parameters:
        - $ref: '#/components/parameters/OperationsCursor'
      responses:
        '200':
          description: Page of tickets with chronological replies
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Submit a service ticket to the manufacturer of an order or a known counterpart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, subject, detail, request_id]
              oneOf:
                - required: [order_id]
                - required: [manufacturer_id]
              properties:
                order_id: { $ref: '#/components/schemas/ID' }
                manufacturer_id: { $ref: '#/components/schemas/ID' }
                category: { type: string, enum: ['产品使用', '授权与交付', '订单与结算'] }
                subject: { type: string, minLength: 1, maxLength: 80 }
                detail: { type: string, minLength: 1, maxLength: 500 }
                request_id: { type: string, format: uuid }
      responses:
        '200':
          description: Ticket ID, including replay of a previously saved submission
        default:
          $ref: '#/components/responses/Error'
  /api/retail/v1/operations/tickets/{id}/{action}:
    post:
      summary: Resolve as the manufacturer, or reopen or close as the reseller
      parameters:
        - $ref: '#/components/parameters/OperationsID'
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [resolve, reopen, close] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { type: integer, minimum: 1 }
                reply: { type: string, maxLength: 500, description: Required for resolve and reopen. }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /api/retail/v1/operations/overview:
    get:
      summary: Get the signed-in reseller's customer and retail totals
      responses:
        '200':
          description: Customer, order and renewal counts, plus pending commission in cents as a decimal string
        default:
          $ref: '#/components/responses/Error'
  /api/retail/v1/operations/customers:
    get:
      summary: List the reseller's prospects, linked customers, and retail customers
      parameters:
        - $ref: '#/components/parameters/OperationsCursor'
      responses:
        '200':
          description: Page of customer profiles in data.items, with the continuation in data.next_cursor
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Create a private prospect profile for the reseller
      requestBody:
        $ref: '#/components/requestBodies/OperationsCustomer'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /api/retail/v1/operations/customers/{id}:
    put:
      summary: Update a private profile without granting customer access
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^[op][1-9][0-9]*$' }
      requestBody:
        $ref: '#/components/requestBodies/OperationsCustomer'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /api/retail/v1/operations/renewals:
    get:
      summary: List the reseller's paid annual retail orders with renewal follow-up
      parameters:
        - $ref: '#/components/parameters/OperationsCursor'
      responses:
        '200':
          description: Page of renewals in data.items, with the continuation in data.next_cursor
        default:
          $ref: '#/components/responses/Error'
  /api/retail/v1/operations/renewals/{id}:
    put:
      summary: Save the latest follow-up for a paid annual order of the reseller
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ID' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 300 }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /api/ai/match-products:
    post:
      summary: Match confirmed requirements against published product profiles as a reseller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmedRequirement' }
      responses:
        '200':
          description: Ranked product candidates with checks and manufacturer sources
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            maxItems: 8
                            items: { $ref: '#/components/schemas/ProductMatch' }
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/organization-links:
    get:
      summary: List organizations linked to the current customer or reseller
      responses:
        '200':
          description: Linked organizations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Organization' }
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/projects:
    get:
      summary: List channel projects visible to the authenticated organization
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: after
          in: query
          schema: { type: string, default: '0' }
      responses:
        '200':
          description: Page of projects in the caller's role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ChannelProject' }
                          next_cursor: { type: [string, 'null'] }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Create a channel project as a customer or its authorized reseller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, title, requirement]
              additionalProperties: false
              properties:
                requestId: { type: string, format: uuid }
                title: { type: string, minLength: 1, maxLength: 120 }
                requirement: { type: string, minLength: 1, maxLength: 3000 }
                dueDate: { type: string, format: date }
                customerId:
                  $ref: '#/components/schemas/ID'
                  description: Required for a reseller. A customer uses its own organization from the session.
                resellerId:
                  $ref: '#/components/schemas/ID'
                  description: Required for a customer linked to multiple resellers.
      responses:
        '201':
          $ref: '#/components/responses/ChannelProject'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/projects/workspace:
    get:
      summary: List lightweight workspace rows and aggregate counts for the current organization
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [all, mine, partners], default: all }
        - name: stage
          in: query
          description: Stage code as projected for the caller's role.
          schema: { type: string }
        - name: q
          in: query
          description: Literal search over the project number, display title and customer name when visible.
          schema: { type: string, maxLength: 120 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: after
          in: query
          description: Cursor from the previous response for the same scope and filters.
          schema: { type: string }
      responses:
        '200':
          description: A project page with counts and visible stage options independent of the current filters.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items, next_cursor, counts, stages]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ChannelProjectListItem' }
                          next_cursor: { type: [string, 'null'] }
                          counts:
                            type: object
                            required: [all, mine, partners]
                            properties:
                              all: { type: integer, minimum: 0 }
                              mine: { type: integer, minimum: 0 }
                              partners: { type: integer, minimum: 0 }
                          stages:
                            type: array
                            items:
                              type: object
                              required: [id, label]
                              properties:
                                id: { type: string }
                                label: { type: string }
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      summary: Get a project and its visible event history
      responses:
        '200':
          $ref: '#/components/responses/ChannelProject'
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/projects/{id}/opportunities:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      summary: List opportunities associated with a project in the current reseller organization
      parameters:
        - name: before
          in: query
          description: Use the next_cursor from the previous page.
          schema: { $ref: '#/components/schemas/ID' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Page of linked opportunities, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              required: [id, note, stage]
                              properties:
                                id: { $ref: '#/components/schemas/ID' }
                                note: { type: string }
                                stage: { type: string, enum: [open, introduced, won, lost, settled] }
                          next_cursor: { type: [string, 'null'] }
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/projects/{id}/inquiry-draft:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      summary: Get the current member's latest draft for a project awaiting inquiry
      responses:
        '200':
          $ref: '#/components/responses/InquiryDraft'
        '404':
          description: No draft for the current member, project revision and a still-published product
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Prepare an inquiry draft after the reseller confirms the requirement fields
      description: Retrying the same request ID and body returns the saved draft. Submitting an inquiry uses the separate submitInquiry project action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, revision, confirmed, productId, requirement]
              additionalProperties: false
              properties:
                requestId: { type: string, format: uuid }
                revision: { type: integer, minimum: 1 }
                confirmed: { const: true }
                productId: { $ref: '#/components/schemas/ID' }
                requirement: { $ref: '#/components/schemas/ConfirmedRequirement' }
      responses:
        '201':
          $ref: '#/components/responses/InquiryDraft'
        '409':
          description: revision_conflict, invalid_transition or idempotency_conflict
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/projects/{id}/actions/{action}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
      - name: action
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProjectAction' }
    post:
      summary: Apply a project, quote, order or fulfillment action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, revision, payload]
              additionalProperties: false
              properties:
                requestId: { type: string, format: uuid }
                revision: { type: integer, minimum: 1 }
                payload:
                  description: Use a quote draft for channelQuote and salesQuote, a quoteId for confirmSales and placeOrder, or a note as described in the channel contract.
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [product, summary]
                      properties:
                        product: { $ref: '#/components/schemas/ID' }
                        summary: { type: string, minLength: 1, maxLength: 3000 }
                    - type: object
                      maxProperties: 0
                    - type: object
                      additionalProperties: false
                      required: [note]
                      properties:
                        note: { type: string, maxLength: 3000 }
                    - $ref: '#/components/schemas/ProjectQuoteDraft'
                    - type: object
                      additionalProperties: false
                      required: [quoteId]
                      properties:
                        quoteId: { $ref: '#/components/schemas/ID' }
      responses:
        '200':
          $ref: '#/components/responses/ChannelProject'
        '409':
          description: revision_conflict, invalid_transition, idempotency_conflict, or quote_expired
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/opportunities/desk:
    get:
      summary: Get the current dealer's team workspace and member-specific follow-ups
      responses:
        '200':
          description: Opportunities, partners, gaps, reverse matches, and follow-up tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/OpportunityDesk' }
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/opportunities/preview:
    post:
      summary: Preview recommendations from the reseller's partner directory without saving an opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldworkCapability' }
      responses:
        '200':
          $ref: '#/components/responses/OpportunityRecommendation'
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/opportunities/{id}/recommendation:
    get:
      summary: Get the recommendations and clarification questions for an accessible opportunity
      parameters:
        - $ref: '#/components/parameters/FieldworkID'
      responses:
        '200':
          $ref: '#/components/responses/OpportunityRecommendation'
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/opportunities:
    post:
      summary: Capture a confirmed additional requirement for an accessible project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, projectId, payload]
              properties:
                requestId: { type: string, format: uuid }
                projectId: { $ref: '#/components/schemas/ID' }
                payload:
                  allOf:
                    - $ref: '#/components/schemas/FieldworkCapability'
                    - type: object
                      required: [note]
                      properties:
                        note: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          $ref: '#/components/responses/Opportunity'
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/opportunities/partners:
    post:
      summary: Record an authorized partner capability and evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, payload]
              properties:
                requestId: { type: string, format: uuid }
                payload:
                  allOf:
                    - $ref: '#/components/schemas/FieldworkCapability'
                    - type: object
                      required: [name, owner, category]
                      properties:
                        name: { type: string, minLength: 1, maxLength: 80 }
                        owner: { type: string, minLength: 1, maxLength: 60 }
                        evidence: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Created partner
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/FieldworkPartner' }
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/opportunities/{id}/actions/{action}:
    parameters:
      - $ref: '#/components/parameters/FieldworkID'
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [clarify, acknowledge, contactReview, rejectPartner, introduce, follow, win, lose, settle]
    post:
      summary: Apply a dealer action with revision and replay protection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FieldworkRevision'
                - type: object
                  required: [payload]
                  properties:
                    payload:
                      type: object
                      description: Use the fields for the selected action. Acknowledge and settle accept an empty object.
                      properties:
                        category: { type: string }
                        source: { type: string }
                        target: { type: string }
                        partnerId: { $ref: '#/components/schemas/ID' }
                        checks: { $ref: '#/components/schemas/ContactChecks' }
                        note: { type: string, maxLength: 500 }
                        reason: { type: string, maxLength: 500 }
                        consent: { type: boolean, description: Both parties have consented }
                        followUp: { type: string, format: date }
                        followReason: { type: string, enum: [customer, partner, fee] }
                        feeAmount: { type: string, example: '1500.00' }
                        feeTerms: { type: string, maxLength: 300 }
                        outcome: { type: string, maxLength: 500 }
                        remember: { type: boolean }
            examples:
              introduce:
                value:
                  requestId: 50fcd5ce-ffb8-472e-b28c-306ecb6ca604
                  revision: 4
                  payload: { partnerId: '21', consent: true, followUp: '2027-01-15', feeAmount: '1500.00', feeTerms: 验收后 }
              contactReview:
                value:
                  requestId: 50fcd5ce-ffb8-472e-b28c-306ecb6ca605
                  revision: 3
                  payload: { partnerId: '21', checks: { version: confirmed, availability: unknown }, note: 已和团队核对版本 }
      responses:
        '200':
          $ref: '#/components/responses/Opportunity'
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/visits:
    get:
      summary: List the authenticated dealer member's drafts
      responses:
        '200':
          description: Drafts for the current member
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Visit' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Save a new visit draft at revision zero
      requestBody:
        $ref: '#/components/requestBodies/VisitSave'
      responses:
        '201':
          $ref: '#/components/responses/Visit'
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/visits/{id}:
    parameters:
      - $ref: '#/components/parameters/FieldworkID'
    get:
      summary: Read one draft owned by the authenticated dealer member
      responses:
        '200':
          $ref: '#/components/responses/Visit'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Save a new revision of an existing visit draft
      requestBody:
        $ref: '#/components/requestBodies/VisitSave'
      responses:
        '200':
          $ref: '#/components/responses/Visit'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove a draft from the owner's list while retaining its audit history
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldworkRevision' }
      responses:
        '200':
          description: Draft removal confirmed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [id, revision, deleted]
                        properties:
                          id: { $ref: '#/components/schemas/ID' }
                          revision: { type: integer }
                          deleted: { const: true }
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/visits/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/FieldworkID'
    post:
      summary: Confirm reviewed notes and optionally link an independent opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FieldworkRevision'
                - $ref: '#/components/schemas/FieldworkCapability'
                - type: object
                  required: [confirmed]
                  properties:
                    confirmed: { const: true }
                    createOpportunity: { type: boolean, default: false }
            example:
              requestId: 50fcd5ce-ffb8-472e-b28c-306ecb6ca606
              revision: 2
              confirmed: true
              createOpportunity: true
      responses:
        '200':
          $ref: '#/components/responses/Visit'
        default:
          $ref: '#/components/responses/Error'
  /api/tables/v1/sheets:
    get:
      summary: List sheets accessible by the signed-in member
      parameters:
        - name: after
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Visible sheets and their pagination cursor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items, nextCursor]
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/Sheet' } }
                          nextCursor: { type: [string, 'null'] }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Create a sheet with an idempotent request ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SheetSettings'
                - type: object
                  required: [requestId]
                  properties:
                    requestId: { type: string, format: uuid }
      responses:
        '201':
          $ref: '#/components/responses/Sheet'
        default:
          $ref: '#/components/responses/Error'
  /api/tables/v1/sheets/{id}:
    parameters:
      - $ref: '#/components/parameters/SheetID'
    get:
      summary: Read sheet settings and edit permissions
      responses:
        '200':
          $ref: '#/components/responses/Sheet'
        default:
          $ref: '#/components/responses/Error'
  /api/tables/v1/sheets/{id}/window:
    parameters:
      - $ref: '#/components/parameters/SheetID'
    get:
      summary: Read raw cells from a zero-based rectangle of at most 2,048 cells
      parameters:
        - name: row
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 99999 }
        - name: col
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 127 }
        - name: height
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: width
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Sheet revision and nonempty cells from the same snapshot
        default:
          $ref: '#/components/responses/Error'
  /api/tables/v1/sheets/{id}/search:
    parameters:
      - $ref: '#/components/parameters/SheetID'
    post:
      summary: Search a sheet or preview a replacement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 160 }
                matchCase: { type: boolean }
                wholeCell: { type: boolean }
                includeFormulas: { type: boolean }
                replacement: { type: string, maxLength: 1000 }
                revision: { type: integer, minimum: 1 }
                after:
                  type: string
                  description: Continue with the returned cursor and the same revision and search terms.
      responses:
        '200':
          description: Matching cells, replacement previews, scanned count, revision and cursor
        default:
          $ref: '#/components/responses/Error'
  /api/tables/v1/sheets/{id}/changes:
    parameters:
      - $ref: '#/components/parameters/SheetID'
    post:
      summary: Atomically save cell edits and optional sheet settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, revision, cells]
              properties:
                requestId: { type: string, format: uuid }
                revision: { type: integer, minimum: 1 }
                cells:
                  type: array
                  maxItems: 250
                  items: { $ref: '#/components/schemas/SheetCell' }
                settings: { $ref: '#/components/schemas/SheetSettings' }
      responses:
        '200':
          description: Applied revision, including a replay for the same request ID and edits
        '409':
          description: Stale revision or a reused request ID with different edits
        '422':
          description: Invalid cell input. The zero-based position in the request is reported in data.index.
        default:
          $ref: '#/components/responses/Error'
  /api/tables/v1/sheets/{id}/csv:
    parameters:
      - $ref: '#/components/parameters/SheetID'
    get:
      summary: Download up to 10,000 rows from a visible sheet as CSV
      parameters:
        - name: start
          in: query
          schema: { type: integer, minimum: 0, maximum: 99999, default: 0 }
        - name: count
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 10000 }
      responses:
        '200':
          description: UTF-8 CSV attachment
          content:
            text/csv:
              schema: { type: string }
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    SheetID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FinanceKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [topups, invoices, claims] }
    OperationsID:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ID' }
    OperationsCursor:
      name: after
      in: query
      schema: { type: string }
      description: Use the previous response's next_cursor to read the next page.
    FieldworkID:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ID' }
  requestBodies:
    OperationsCustomer:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: A prospect requires its own name. An organization profile uses the existing organization name.
            properties:
              name: { type: string, maxLength: 120 }
              contact: { type: string, maxLength: 40 }
              note: { type: string, maxLength: 200 }
    VisitSave:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FieldworkRevision'
              - type: object
                required: [payload]
                properties:
                  payload: { $ref: '#/components/schemas/VisitDraft' }
    Product:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductInput' }
  responses:
    Sheet:
      description: Sheet metadata and permissions for the current member
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/Sheet' }
    ProductKnowledge:
      description: Product matching and licensing information
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/ProductKnowledge' }
    InquiryDraft:
      description: Saved inquiry draft
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/InquiryDraft' }
    OpportunityRecommendation:
      description: Clarification questions, eligible matches and a brief based on the capability fields
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/OpportunityRecommendation' }
    Opportunity:
      description: Opportunity visible to its dealer team
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/Opportunity' }
    Visit:
      description: Visit draft visible only to its creating member
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/Visit' }
    ChannelProject:
      description: Project projected for the caller's role
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/ChannelProject' }
    Product:
      description: Visible product
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/Product' }
    Success:
      description: Successful operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Error:
      description: Invalid input, insufficient permission, missing resource or unavailable dependency
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            code: 401
            message: authentication_required
            data: null
  schemas:
    SheetSettings:
      type: object
      required: [name, visibility, rowCount, columns]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        visibility: { type: string, enum: [private, org_read, org_edit] }
        rowCount: { type: integer, minimum: 1, maximum: 100000 }
        columns:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            required: [label, kind]
            properties:
              label: { type: string, minLength: 1, maxLength: 80 }
              kind: { type: string, enum: [auto, text, number, date, checkbox] }
    Sheet:
      allOf:
        - $ref: '#/components/schemas/SheetSettings'
        - type: object
          required: [id, revision, canEdit, isOwner, updatedAt]
          properties:
            id: { type: string, format: uuid }
            revision: { type: integer, minimum: 1 }
            canEdit: { type: boolean }
            isOwner: { type: boolean }
            updatedAt: { type: string, format: date-time }
    SheetCell:
      type: object
      required: [row, col, input]
      properties:
        row: { type: integer, minimum: 0, maximum: 99999 }
        col: { type: integer, minimum: 0, maximum: 127 }
        input: { type: string, description: At most 1,000 UTF-8 bytes. An empty string clears the cell. }
    FieldworkRevision:
      type: object
      required: [requestId, revision]
      properties:
        requestId: { type: string, format: uuid }
        revision: { type: integer, minimum: 0 }
    FieldworkCapability:
      type: object
      properties:
        category: { type: string, enum: ['', integration, connector, plugin, migration, training, other] }
        source: { $ref: '#/components/schemas/FieldworkSystem' }
        target: { $ref: '#/components/schemas/FieldworkSystem' }
    FieldworkSystem:
      type: string
      enum: ['', erp, mes, oa, ide, wms, crm, other]
    FieldworkPartner:
      allOf:
        - $ref: '#/components/schemas/FieldworkCapability'
        - type: object
          properties:
            id: { $ref: '#/components/schemas/ID' }
            name: { type: string }
            owner: { type: string }
            evidence: { type: string }
            createdAt: { type: string, format: date-time }
    ContactChecks:
      type: object
      properties:
        version: { $ref: '#/components/schemas/CheckState' }
        interfaceAccess: { $ref: '#/components/schemas/CheckState' }
        region: { $ref: '#/components/schemas/CheckState' }
        availability: { $ref: '#/components/schemas/CheckState' }
    CheckState:
      type: string
      enum: ['', unknown, confirmed, blocked]
    OpportunityRecommendation:
      type: object
      required: [brief, questions, matches]
      properties:
        brief: { type: string }
        questions: { type: array, items: { type: string } }
        matches:
          type: array
          items:
            type: object
            properties:
              partnerId: { $ref: '#/components/schemas/ID' }
              name: { type: string }
              owner: { type: string }
              evidence: { type: string }
              reason: { type: string }
              caveat: { type: string }
              checks: { $ref: '#/components/schemas/ContactChecks' }
              reviewNote: { type: string }
    Opportunity:
      allOf:
        - $ref: '#/components/schemas/FieldworkCapability'
        - $ref: '#/components/schemas/OpportunityRecommendation'
        - type: object
          properties:
            id: { $ref: '#/components/schemas/ID' }
            projectId: { $ref: '#/components/schemas/ID' }
            projectTitle: { type: string }
            note: { type: string }
            revision: { type: integer }
            stage: { type: string, enum: [open, introduced, won, lost, settled] }
            partnerId: { type: string }
            followUp: { type: string }
            followReason: { type: string, enum: ['', customer, partner, fee] }
            feeAmount: { type: string }
            feeTerms: { type: string }
            outcome: { type: string }
            knownPartnerIds: { type: array, items: { $ref: '#/components/schemas/ID' } }
            contactReviews:
              type: object
              additionalProperties:
                type: object
                properties:
                  checks: { $ref: '#/components/schemas/ContactChecks' }
                  note: { type: string }
            rejections:
              type: array
              items:
                type: object
                properties:
                  partnerId: { $ref: '#/components/schemas/ID' }
                  name: { type: string }
                  reason: { type: string }
                  at: { type: string, format: date-time }
            history:
              type: array
              items:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  label: { type: string }
    OpportunityDesk:
      type: object
      required: [items, partners, gaps, reverseMatches, tasks]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Opportunity' } }
        partners: { type: array, items: { $ref: '#/components/schemas/FieldworkPartner' } }
        gaps:
          type: array
          items:
            type: object
            properties:
              category: { type: string }
              label: { type: string }
              count: { type: integer }
        reverseMatches:
          type: array
          items:
            type: object
            properties:
              partnerId: { $ref: '#/components/schemas/ID' }
              opportunityId: { $ref: '#/components/schemas/ID' }
        tasks:
          type: array
          items:
            type: object
            properties:
              opportunityId: { $ref: '#/components/schemas/ID' }
              projectTitle: { type: string }
              reason: { type: string }
              action: { type: string }
              date: { type: string }
    VisitDraft:
      type: object
      required: [text]
      properties:
        projectId: { type: string, description: Empty when a project has not yet been selected }
        text: { type: string, minLength: 1, maxLength: 2000 }
        main: { type: string, maxLength: 2000 }
        additional: { type: string, maxLength: 2000 }
        reviewed: { type: boolean }
    Visit:
      allOf:
        - $ref: '#/components/schemas/VisitDraft'
        - type: object
          properties:
            id: { $ref: '#/components/schemas/ID' }
            opportunityId: { type: string }
            confirmed: { type: boolean }
            revision: { type: integer }
            updatedAt: { type: string, format: date-time }
    Envelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data: {}
    ID:
      type: string
      pattern: '^[1-9][0-9]*$'
      example: '1'
    Organization:
      type: object
      required: [id, name, kind]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        name: { type: string }
        kind: { type: string, enum: [MANUFACTURER, RESELLER, CUSTOMER] }
    ProjectAction:
      type: string
      enum: [submitInquiry, withdrawInquiry, flagGap, requestInfo, replyInfo, channelQuote, reviseChannel, salesQuote, reviseSales, confirmSales, placeOrder, supply, implement, rectify, accept]
    ProjectQuoteLine:
      type: object
      additionalProperties: false
      required: [label, quantity, unitPrice]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
        unitPrice: { type: string, pattern: '^[0-9]{1,8}(\.[0-9]{1,2})?$', example: '1500.00' }
    ProjectQuoteDraft:
      type: object
      additionalProperties: false
      required: [lines, validUntil, deliveryDays]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ProjectQuoteLine' }
        validUntil: { type: string, format: date, description: Inclusive China Standard Time date }
        deliveryDays: { type: integer, minimum: 1, maximum: 3650 }
        note: { type: string, maxLength: 3000 }
    ProjectQuoteVersion:
      type: object
      required: [id, version, status, lines, total, validUntil, deliveryDays, note]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, superseded, confirmed, expired, ordered] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ProjectQuoteLine' }
        total: { type: string, pattern: '^[0-9]+\.[0-9]{2}$', example: '30000.00' }
        validUntil: { type: string, format: date }
        deliveryDays: { type: integer, minimum: 1 }
        note: { type: string }
    ChannelProjectListItem:
      type: object
      required: [id, title, stage, stageLabel, isTodo, nextStep]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        title: { type: string }
        customerName: { type: string }
        dueDate: { type: string, format: date }
        stage: { type: string }
        stageLabel: { type: string }
        isTodo: { type: boolean }
        nextStep: { type: string }
    ChannelProject:
      type: object
      required: [id, title, stage, stageLabel, revision, isTodo, nextStep, actions, timeline]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        title: { type: string }
        customerName: { type: string, description: Visible to the customer and reseller }
        requirement: { type: string, description: Visible to the customer and reseller }
        dueDate: { type: string, format: date }
        product: { $ref: '#/components/schemas/ID' }
        productName: { type: string, description: Product name at inquiry submission. Returned only when the product ID is visible. }
        stage:
          type: string
          enum: [requested, customer_info, inquired, vendor_info, processing, channel_quoted, channel_revision, channel_wait, sales_quoted, sales_revision, confirmed, ordered, supplied, shipped, acceptance, rectification, completed]
        stageLabel: { type: string }
        revision: { type: integer, minimum: 1 }
        isTodo: { type: boolean }
        nextStep: { type: string }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ProjectAction' }
        inquiry:
          type: object
          required: [id, summary, processed]
          properties:
            id: { type: string }
            summary: { type: string }
            processed: { type: boolean }
            gapNote: { type: string }
        channelQuotes:
          type: array
          description: Available to the manufacturer and the reseller
          items: { $ref: '#/components/schemas/ProjectQuoteVersion' }
        salesQuotes:
          type: array
          description: Available to the customer and the reseller
          items: { $ref: '#/components/schemas/ProjectQuoteVersion' }
        order:
          type: object
          required: [id]
          properties:
            id: { $ref: '#/components/schemas/ID' }
            channelQuoteId: { $ref: '#/components/schemas/ID' }
            salesQuoteId: { $ref: '#/components/schemas/ID' }
        supplyNote: { type: string }
        implementationNote: { type: string, description: Available to the customer and reseller }
        timeline:
          type: array
          items:
            type: object
            required: [at, label, detail]
            properties:
              at: { type: string, format: date-time }
              label: { type: string }
              detail: { type: string }
    User:
      type: object
      required: [id, username, organization]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        username: { type: string }
        organization: { $ref: '#/components/schemas/Organization' }
    ProductInput:
      type: object
      required: [name, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        version: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        published: { type: boolean, default: false }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, manufacturer_id, description, published]
          properties:
            id: { $ref: '#/components/schemas/ID' }
            manufacturer_id: { $ref: '#/components/schemas/ID' }
    KnowledgeSource:
      type: object
      required: [title, reference, excerpt]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        reference: { type: string, minLength: 1, maxLength: 300, description: A link, file name or page reference }
        excerpt: { type: string, minLength: 1, maxLength: 500 }
    ProductKnowledge:
      type: object
      properties:
        category: { type: string, maxLength: 80 }
        modules:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 70 }
        deployment_modes:
          type: array
          uniqueItems: true
          items: { type: string, enum: [private, on_premises, cloud, saas] }
        license:
          type: object
          properties:
            minimum: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
            maximum: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
            note: { type: string, maxLength: 500 }
        sources:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/KnowledgeSource' }
    ConfirmedRequirement:
      type: object
      description: At least one confirmed field with a nonempty value. Employee count and license count are independent.
      properties:
        enterprise_type: { type: string, maxLength: 120 }
        employee_count: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        required_modules:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 70 }
        deployment_mode: { type: string, maxLength: 80 }
        license_count: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        version: { type: string, maxLength: 100 }
    ProductMatch:
      type: object
      required: [product, category, status, checks, sources]
      properties:
        product: { $ref: '#/components/schemas/Product' }
        category: { type: string }
        status: { type: string, enum: [matched, needs_confirmation, mismatch] }
        checks:
          type: array
          items:
            type: object
            required: [field, value, status, detail]
            properties:
              field: { type: string, enum: [module, deployment, version, license, source] }
              value: { type: string }
              status: { type: string, enum: [met, missing, unknown] }
              detail: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeSource' }
    InquiryDraft:
      type: object
      required: [id, projectId, projectRevision, productId, requirement, summary, createdAt]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        projectId: { $ref: '#/components/schemas/ID' }
        projectRevision: { type: integer, minimum: 1 }
        productId: { $ref: '#/components/schemas/ID' }
        requirement: { $ref: '#/components/schemas/ConfirmedRequirement' }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
    Requirement:
      type: object
      required: [enterprise_type, employee_count, required_modules, deployment_mode, license_count, version, missing_fields, follow_up_questions, need_user_confirmation]
      properties:
        enterprise_type: { type: string, maxLength: 120 }
        employee_count: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        required_modules: { type: array, maxItems: 30, items: { type: string, minLength: 1, maxLength: 70 } }
        deployment_mode: { type: string, maxLength: 80 }
        license_count: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        version: { type: string, maxLength: 100, description: Version requested in the input, or empty when unknown. }
        missing_fields: { type: array, maxItems: 30, items: { type: string, minLength: 1, maxLength: 100 } }
        follow_up_questions: { type: array, maxItems: 30, items: { type: string, minLength: 1, maxLength: 200 } }
        need_user_confirmation: { const: true }

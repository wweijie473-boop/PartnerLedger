openapi: 3.1.0
info:
  title: PartnerLedger API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Check if the application process is alive
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /readyz:
    get:
      summary: Check that the MySQL schema and Redis are ready
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '503':
          $ref: '#/components/responses/Error'
  /api/auth/register:
    post:
      summary: Register the first account for a new organization
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, organization_name, organization_kind]
              additionalProperties: false
              properties:
                username: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{2,63}$' }
                password: { type: string, format: password, description: 12 to 72 UTF-8 bytes }
                organization_name: { type: string, minLength: 1, maxLength: 150 }
                organization_kind: { type: string, enum: [RESELLER, MANUFACTURER, CUSTOMER] }
      responses:
        '201':
          description: Account and isolated organization created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [organization_id]
                        properties:
                          organization_id: { $ref: '#/components/schemas/ID' }
        '409':
          description: Username unavailable
        '429':
          description: Registration rate limited
        default:
          $ref: '#/components/responses/Error'
  /api/auth/login:
    post:
      summary: Start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: dealer_demo }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session and user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [access_token, token_type, expires_in, user]
                        properties:
                          access_token: { type: string }
                          token_type: { const: Bearer }
                          expires_in: { type: integer, example: 43200 }
                          user: { $ref: '#/components/schemas/User' }
        default:
          $ref: '#/components/responses/Error'
  /api/auth/logout:
    post:
      summary: Revoke the current session
      responses:
        '200':
          $ref: '#/components/responses/Success'
        default:
          $ref: '#/components/responses/Error'
  /api/user/profile:
    get:
      summary: Read the authenticated user
      responses:
        '200':
          description: Current user and organization
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        default:
          $ref: '#/components/responses/Error'
  /api/org/current:
    get:
      summary: Read the current organization
      responses:
        '200':
          description: Current organization
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Organization' }
        default:
          $ref: '#/components/responses/Error'
  /api/products:
    get:
      summary: List products visible to the current organization
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: after
          in: query
          schema: { type: string, pattern: '^[0-9]+$', default: '0' }
      responses:
        '200':
          description: Product page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Product' }
                          next_cursor: { type: [string, 'null'] }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Create a product as a manufacturer
      requestBody:
        $ref: '#/components/requestBodies/Product'
      responses:
        '201':
          $ref: '#/components/responses/Product'
        default:
          $ref: '#/components/responses/Error'
  /api/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      summary: Read a visible product
      responses:
        '200':
          $ref: '#/components/responses/Product'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Update a product that belongs to the manufacturer
      requestBody:
        $ref: '#/components/requestBodies/Product'
      responses:
        '200':
          $ref: '#/components/responses/Product'
        default:
          $ref: '#/components/responses/Error'
  /api/products/{id}/knowledge:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      summary: Get the matching profile for a visible product
      responses:
        '200':
          $ref: '#/components/responses/ProductKnowledge'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Replace the matching profile of a product owned by the manufacturer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductKnowledge' }
      responses:
        '200':
          $ref: '#/components/responses/ProductKnowledge'
        default:
          $ref: '#/components/responses/Error'
  /api/ai/parse-requirement:
    post:
      summary: Extract fields from a reseller's ERP requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
            example:
              text: 我们是 120 人的制造公司，需要财务库存和私有化部署。
      responses:
        '200':
          description: Structured extraction for human confirmation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Requirement'
        default:
          $ref: '#/components/responses/Error'
  /api/ai/match-products:
    post:
      summary: Match confirmed requirements against published product profiles as a reseller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmedRequirement' }
      responses:
        '200':
          description: Ranked product candidates with checks and manufacturer sources
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            maxItems: 8
                            items: { $ref: '#/components/schemas/ProductMatch' }
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/organization-links:
    get:
      summary: List organizations linked to the current customer or reseller
      responses:
        '200':
          description: Linked organizations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Organization' }
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/projects:
    get:
      summary: List channel projects visible to the authenticated organization
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: after
          in: query
          schema: { type: string, default: '0' }
      responses:
        '200':
          description: Page of projects in the caller's role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items, next_cursor]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ChannelProject' }
                          next_cursor: { type: [string, 'null'] }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Create a channel project as a customer or its authorized reseller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, title, requirement]
              additionalProperties: false
              properties:
                requestId: { type: string, format: uuid }
                title: { type: string, minLength: 1, maxLength: 120 }
                requirement: { type: string, minLength: 1, maxLength: 3000 }
                dueDate: { type: string, format: date }
                customerId:
                  $ref: '#/components/schemas/ID'
                  description: Required for a reseller. A customer uses its own organization from the session.
                resellerId:
                  $ref: '#/components/schemas/ID'
                  description: Required for a customer linked to multiple resellers.
      responses:
        '201':
          $ref: '#/components/responses/ChannelProject'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      summary: Get a project and its visible event history
      responses:
        '200':
          $ref: '#/components/responses/ChannelProject'
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/projects/{id}/inquiry-draft:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
    get:
      summary: Get the current member's latest draft for a project awaiting inquiry
      responses:
        '200':
          $ref: '#/components/responses/InquiryDraft'
        '404':
          description: No draft for the current member, project revision and a still-published product
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Prepare an inquiry draft after the reseller confirms the requirement fields
      description: Retrying the same request ID and body returns the saved draft. Submitting an inquiry uses the separate submitInquiry project action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, revision, confirmed, productId, requirement]
              additionalProperties: false
              properties:
                requestId: { type: string, format: uuid }
                revision: { type: integer, minimum: 1 }
                confirmed: { const: true }
                productId: { $ref: '#/components/schemas/ID' }
                requirement: { $ref: '#/components/schemas/ConfirmedRequirement' }
      responses:
        '201':
          $ref: '#/components/responses/InquiryDraft'
        '409':
          description: revision_conflict, invalid_transition or idempotency_conflict
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/projects/{id}/actions/{action}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ID' }
      - name: action
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ProjectAction' }
    post:
      summary: Apply a project, quote, order or fulfillment action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, revision, payload]
              additionalProperties: false
              properties:
                requestId: { type: string, format: uuid }
                revision: { type: integer, minimum: 1 }
                payload:
                  description: Use a quote draft for channelQuote and salesQuote, a quoteId for confirmSales and placeOrder, or a note as described in the channel contract.
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [product, summary]
                      properties:
                        product: { $ref: '#/components/schemas/ID' }
                        summary: { type: string, minLength: 1, maxLength: 3000 }
                    - type: object
                      maxProperties: 0
                    - type: object
                      additionalProperties: false
                      required: [note]
                      properties:
                        note: { type: string, maxLength: 3000 }
                    - $ref: '#/components/schemas/ProjectQuoteDraft'
                    - type: object
                      additionalProperties: false
                      required: [quoteId]
                      properties:
                        quoteId: { $ref: '#/components/schemas/ID' }
      responses:
        '200':
          $ref: '#/components/responses/ChannelProject'
        '409':
          description: revision_conflict, invalid_transition, idempotency_conflict, or quote_expired
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/opportunities/desk:
    get:
      summary: Get the current dealer's team workspace and member-specific follow-ups
      responses:
        '200':
          description: Opportunities, partners, gaps, reverse matches, and follow-up tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/OpportunityDesk' }
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/opportunities:
    post:
      summary: Capture a confirmed additional requirement for an accessible project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, projectId, payload]
              properties:
                requestId: { type: string, format: uuid }
                projectId: { $ref: '#/components/schemas/ID' }
                payload:
                  allOf:
                    - $ref: '#/components/schemas/FieldworkCapability'
                    - type: object
                      required: [note]
                      properties:
                        note: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          $ref: '#/components/responses/Opportunity'
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/opportunities/partners:
    post:
      summary: Record an authorized partner capability and evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, payload]
              properties:
                requestId: { type: string, format: uuid }
                payload:
                  allOf:
                    - $ref: '#/components/schemas/FieldworkCapability'
                    - type: object
                      required: [name, owner, category]
                      properties:
                        name: { type: string, minLength: 1, maxLength: 80 }
                        owner: { type: string, minLength: 1, maxLength: 60 }
                        evidence: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Created partner
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/FieldworkPartner' }
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/opportunities/{id}/actions/{action}:
    parameters:
      - $ref: '#/components/parameters/FieldworkID'
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [clarify, acknowledge, contactReview, rejectPartner, introduce, follow, win, lose, settle]
    post:
      summary: Apply a dealer action with revision and replay protection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FieldworkRevision'
                - type: object
                  required: [payload]
                  properties:
                    payload:
                      type: object
                      description: Use the fields for the selected action. Acknowledge and settle accept an empty object.
                      properties:
                        category: { type: string }
                        source: { type: string }
                        target: { type: string }
                        partnerId: { $ref: '#/components/schemas/ID' }
                        checks: { $ref: '#/components/schemas/ContactChecks' }
                        note: { type: string, maxLength: 500 }
                        reason: { type: string, maxLength: 500 }
                        consent: { type: boolean, description: Both parties have consented }
                        followUp: { type: string, format: date }
                        followReason: { type: string, enum: [customer, partner, fee] }
                        feeAmount: { type: string, example: '1500.00' }
                        feeTerms: { type: string, maxLength: 300 }
                        outcome: { type: string, maxLength: 500 }
                        remember: { type: boolean }
            examples:
              introduce:
                value:
                  requestId: 50fcd5ce-ffb8-472e-b28c-306ecb6ca604
                  revision: 4
                  payload: { partnerId: '21', consent: true, followUp: '2027-01-15', feeAmount: '1500.00', feeTerms: 验收后 }
              contactReview:
                value:
                  requestId: 50fcd5ce-ffb8-472e-b28c-306ecb6ca605
                  revision: 3
                  payload: { partnerId: '21', checks: { version: confirmed, availability: unknown }, note: 已和团队核对版本 }
      responses:
        '200':
          $ref: '#/components/responses/Opportunity'
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/visits:
    get:
      summary: List the authenticated dealer member's drafts
      responses:
        '200':
          description: Drafts for the current member
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Visit' }
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Save a new visit draft at revision zero
      requestBody:
        $ref: '#/components/requestBodies/VisitSave'
      responses:
        '201':
          $ref: '#/components/responses/Visit'
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/visits/{id}:
    parameters:
      - $ref: '#/components/parameters/FieldworkID'
    get:
      summary: Read one draft owned by the authenticated dealer member
      responses:
        '200':
          $ref: '#/components/responses/Visit'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Save a new revision of an existing visit draft
      requestBody:
        $ref: '#/components/requestBodies/VisitSave'
      responses:
        '200':
          $ref: '#/components/responses/Visit'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Remove a draft from the owner's list while retaining its audit history
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldworkRevision' }
      responses:
        '200':
          description: Draft removal confirmed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [id, revision, deleted]
                        properties:
                          id: { $ref: '#/components/schemas/ID' }
                          revision: { type: integer }
                          deleted: { const: true }
        default:
          $ref: '#/components/responses/Error'
  /api/channel/v1/visits/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/FieldworkID'
    post:
      summary: Confirm reviewed notes and optionally link an independent opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FieldworkRevision'
                - $ref: '#/components/schemas/FieldworkCapability'
                - type: object
                  required: [confirmed]
                  properties:
                    confirmed: { const: true }
                    createOpportunity: { type: boolean, default: false }
            example:
              requestId: 50fcd5ce-ffb8-472e-b28c-306ecb6ca606
              revision: 2
              confirmed: true
              createOpportunity: true
      responses:
        '200':
          $ref: '#/components/responses/Visit'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    FieldworkID:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ID' }
  requestBodies:
    VisitSave:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FieldworkRevision'
              - type: object
                required: [payload]
                properties:
                  payload: { $ref: '#/components/schemas/VisitDraft' }
    Product:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductInput' }
  responses:
    ProductKnowledge:
      description: Product matching and licensing information
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/ProductKnowledge' }
    InquiryDraft:
      description: Saved inquiry draft
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/InquiryDraft' }
    Opportunity:
      description: Opportunity visible to its dealer team
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/Opportunity' }
    Visit:
      description: Visit draft visible only to its creating member
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/Visit' }
    ChannelProject:
      description: Project projected for the caller's role
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/ChannelProject' }
    Product:
      description: Visible product
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - properties:
                  data: { $ref: '#/components/schemas/Product' }
    Success:
      description: Successful operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Error:
      description: Invalid input, insufficient permission, missing resource or unavailable dependency
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            code: 401
            message: authentication_required
            data: null
  schemas:
    FieldworkRevision:
      type: object
      required: [requestId, revision]
      properties:
        requestId: { type: string, format: uuid }
        revision: { type: integer, minimum: 0 }
    FieldworkCapability:
      type: object
      properties:
        category: { type: string, enum: ['', integration, connector, plugin, migration, training, other] }
        source: { $ref: '#/components/schemas/FieldworkSystem' }
        target: { $ref: '#/components/schemas/FieldworkSystem' }
    FieldworkSystem:
      type: string
      enum: ['', erp, mes, oa, ide, wms, crm, other]
    FieldworkPartner:
      allOf:
        - $ref: '#/components/schemas/FieldworkCapability'
        - type: object
          properties:
            id: { $ref: '#/components/schemas/ID' }
            name: { type: string }
            owner: { type: string }
            evidence: { type: string }
            createdAt: { type: string, format: date-time }
    ContactChecks:
      type: object
      properties:
        version: { $ref: '#/components/schemas/CheckState' }
        interfaceAccess: { $ref: '#/components/schemas/CheckState' }
        region: { $ref: '#/components/schemas/CheckState' }
        availability: { $ref: '#/components/schemas/CheckState' }
    CheckState:
      type: string
      enum: ['', unknown, confirmed, blocked]
    Opportunity:
      allOf:
        - $ref: '#/components/schemas/FieldworkCapability'
        - type: object
          properties:
            id: { $ref: '#/components/schemas/ID' }
            projectId: { $ref: '#/components/schemas/ID' }
            projectTitle: { type: string }
            note: { type: string }
            revision: { type: integer }
            stage: { type: string, enum: [open, introduced, won, lost, settled] }
            partnerId: { type: string }
            followUp: { type: string }
            followReason: { type: string, enum: ['', customer, partner, fee] }
            feeAmount: { type: string }
            feeTerms: { type: string }
            outcome: { type: string }
            brief: { type: string }
            questions: { type: array, items: { type: string } }
            knownPartnerIds: { type: array, items: { $ref: '#/components/schemas/ID' } }
            contactReviews:
              type: object
              additionalProperties:
                type: object
                properties:
                  checks: { $ref: '#/components/schemas/ContactChecks' }
                  note: { type: string }
            rejections:
              type: array
              items:
                type: object
                properties:
                  partnerId: { $ref: '#/components/schemas/ID' }
                  name: { type: string }
                  reason: { type: string }
                  at: { type: string, format: date-time }
            matches:
              type: array
              items:
                type: object
                properties:
                  partnerId: { $ref: '#/components/schemas/ID' }
                  name: { type: string }
                  owner: { type: string }
                  evidence: { type: string }
                  reason: { type: string }
                  caveat: { type: string }
                  checks: { $ref: '#/components/schemas/ContactChecks' }
                  reviewNote: { type: string }
            history:
              type: array
              items:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  label: { type: string }
    OpportunityDesk:
      type: object
      required: [items, partners, gaps, reverseMatches, tasks]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Opportunity' } }
        partners: { type: array, items: { $ref: '#/components/schemas/FieldworkPartner' } }
        gaps:
          type: array
          items:
            type: object
            properties:
              category: { type: string }
              label: { type: string }
              count: { type: integer }
        reverseMatches:
          type: array
          items:
            type: object
            properties:
              partnerId: { $ref: '#/components/schemas/ID' }
              opportunityId: { $ref: '#/components/schemas/ID' }
        tasks:
          type: array
          items:
            type: object
            properties:
              opportunityId: { $ref: '#/components/schemas/ID' }
              projectTitle: { type: string }
              reason: { type: string }
              action: { type: string }
              date: { type: string }
    VisitDraft:
      type: object
      required: [text]
      properties:
        projectId: { type: string, description: Empty when a project has not yet been selected }
        text: { type: string, minLength: 1, maxLength: 2000 }
        main: { type: string, maxLength: 2000 }
        additional: { type: string, maxLength: 2000 }
        reviewed: { type: boolean }
    Visit:
      allOf:
        - $ref: '#/components/schemas/VisitDraft'
        - type: object
          properties:
            id: { $ref: '#/components/schemas/ID' }
            opportunityId: { type: string }
            confirmed: { type: boolean }
            revision: { type: integer }
            updatedAt: { type: string, format: date-time }
    Envelope:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer }
        message: { type: string }
        data: {}
    ID:
      type: string
      pattern: '^[1-9][0-9]*$'
      example: '1'
    Organization:
      type: object
      required: [id, name, kind]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        name: { type: string }
        kind: { type: string, enum: [MANUFACTURER, RESELLER, CUSTOMER] }
    ProjectAction:
      type: string
      enum: [submitInquiry, withdrawInquiry, flagGap, requestInfo, replyInfo, channelQuote, reviseChannel, salesQuote, reviseSales, confirmSales, placeOrder, supply, implement, rectify, accept]
    ProjectQuoteLine:
      type: object
      additionalProperties: false
      required: [label, quantity, unitPrice]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
        unitPrice: { type: string, pattern: '^[0-9]{1,8}(\.[0-9]{1,2})?$', example: '1500.00' }
    ProjectQuoteDraft:
      type: object
      additionalProperties: false
      required: [lines, validUntil, deliveryDays]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ProjectQuoteLine' }
        validUntil: { type: string, format: date, description: Inclusive China Standard Time date }
        deliveryDays: { type: integer, minimum: 1, maximum: 3650 }
        note: { type: string, maxLength: 3000 }
    ProjectQuoteVersion:
      type: object
      required: [id, version, status, lines, total, validUntil, deliveryDays, note]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, superseded, confirmed, expired, ordered] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ProjectQuoteLine' }
        total: { type: string, pattern: '^[0-9]+\.[0-9]{2}$', example: '30000.00' }
        validUntil: { type: string, format: date }
        deliveryDays: { type: integer, minimum: 1 }
        note: { type: string }
    ChannelProject:
      type: object
      required: [id, title, stage, stageLabel, revision, isTodo, nextStep, actions, timeline]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        title: { type: string }
        customerName: { type: string, description: Visible to the customer and reseller }
        requirement: { type: string, description: Visible to the customer and reseller }
        dueDate: { type: string, format: date }
        product: { $ref: '#/components/schemas/ID' }
        stage:
          type: string
          enum: [requested, customer_info, inquired, vendor_info, processing, channel_quoted, channel_revision, channel_wait, sales_quoted, sales_revision, confirmed, ordered, supplied, shipped, acceptance, rectification, completed]
        stageLabel: { type: string }
        revision: { type: integer, minimum: 1 }
        isTodo: { type: boolean }
        nextStep: { type: string }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ProjectAction' }
        inquiry:
          type: object
          required: [id, summary, processed]
          properties:
            id: { type: string }
            summary: { type: string }
            processed: { type: boolean }
            gapNote: { type: string }
        channelQuotes:
          type: array
          description: Available to the manufacturer and the reseller
          items: { $ref: '#/components/schemas/ProjectQuoteVersion' }
        salesQuotes:
          type: array
          description: Available to the customer and the reseller
          items: { $ref: '#/components/schemas/ProjectQuoteVersion' }
        order:
          type: object
          required: [id]
          properties:
            id: { $ref: '#/components/schemas/ID' }
            channelQuoteId: { $ref: '#/components/schemas/ID' }
            salesQuoteId: { $ref: '#/components/schemas/ID' }
        supplyNote: { type: string }
        implementationNote: { type: string, description: Available to the customer and reseller }
        timeline:
          type: array
          items:
            type: object
            required: [at, label, detail]
            properties:
              at: { type: string, format: date-time }
              label: { type: string }
              detail: { type: string }
    User:
      type: object
      required: [id, username, organization]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        username: { type: string }
        organization: { $ref: '#/components/schemas/Organization' }
    ProductInput:
      type: object
      required: [name, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        version: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        published: { type: boolean, default: false }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, manufacturer_id, description, published]
          properties:
            id: { $ref: '#/components/schemas/ID' }
            manufacturer_id: { $ref: '#/components/schemas/ID' }
    KnowledgeSource:
      type: object
      required: [title, reference, excerpt]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        reference: { type: string, minLength: 1, maxLength: 300, description: A link, file name or page reference }
        excerpt: { type: string, minLength: 1, maxLength: 500 }
    ProductKnowledge:
      type: object
      properties:
        category: { type: string, maxLength: 80 }
        modules:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 70 }
        deployment_modes:
          type: array
          uniqueItems: true
          items: { type: string, enum: [private, on_premises, cloud, saas] }
        license:
          type: object
          properties:
            minimum: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
            maximum: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
            note: { type: string, maxLength: 500 }
        sources:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/KnowledgeSource' }
    ConfirmedRequirement:
      type: object
      description: At least one confirmed field with a nonempty value. Employee count and license count are independent.
      properties:
        enterprise_type: { type: string, maxLength: 120 }
        employee_count: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        required_modules:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 70 }
        deployment_mode: { type: string, maxLength: 80 }
        license_count: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        version: { type: string, maxLength: 100 }
    ProductMatch:
      type: object
      required: [product, category, status, checks, sources]
      properties:
        product: { $ref: '#/components/schemas/Product' }
        category: { type: string }
        status: { type: string, enum: [matched, needs_confirmation, mismatch] }
        checks:
          type: array
          items:
            type: object
            required: [field, value, status, detail]
            properties:
              field: { type: string, enum: [module, deployment, version, license, source] }
              value: { type: string }
              status: { type: string, enum: [met, missing, unknown] }
              detail: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/KnowledgeSource' }
    InquiryDraft:
      type: object
      required: [id, projectId, projectRevision, productId, requirement, summary, createdAt]
      properties:
        id: { $ref: '#/components/schemas/ID' }
        projectId: { $ref: '#/components/schemas/ID' }
        projectRevision: { type: integer, minimum: 1 }
        productId: { $ref: '#/components/schemas/ID' }
        requirement: { $ref: '#/components/schemas/ConfirmedRequirement' }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
    Requirement:
      type: object
      required: [enterprise_type, employee_count, required_modules, deployment_mode, license_count, missing_fields, follow_up_questions, need_user_confirmation]
      properties:
        enterprise_type: { type: string }
        employee_count: { type: [integer, 'null'], minimum: 1 }
        required_modules: { type: array, items: { type: string } }
        deployment_mode: { type: string }
        license_count: { type: [integer, 'null'], minimum: 1 }
        missing_fields: { type: array, items: { type: string } }
        follow_up_questions: { type: array, items: { type: string } }
        need_user_confirmation: { const: true }

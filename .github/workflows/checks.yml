name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    env:
      PARTNERLEDGER_MYSQL_DSN: partnerledger_ci:test-ci-only-password@tcp(127.0.0.1:13306)/partnerledger_ci
      PARTNERLEDGER_REDIS_ADDR: 127.0.0.1:16379
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: partnerledger_ci
          MYSQL_USER: partnerledger_ci
          MYSQL_PASSWORD: test-ci-only-password
          MYSQL_ROOT_PASSWORD: test-ci-only-root-password
        ports: ['13306:3306']
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -u partnerledger_ci -ptest-ci-only-password partnerledger_ci -e 'SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4
        ports: ['16379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go run ./cmd/partnerledger migrate
      - run: go test -count=1 ./...
        env:
          PARTNERLEDGER_INTEGRATION_TEST: '1'
          PARTNERLEDGER_TABLES_INTEGRATION_TEST: '1'
